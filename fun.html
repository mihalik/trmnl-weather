<!-- TRMNL Spec does not include the outer html -->
<!--
  "Fun" view: left half is an American Gothic style 1-bit line drawing of the
  two of us, dressed for today's forecast (or tonight's, after dark), with the
  weather in the sky behind us. Rare easter eggs appear now and then.
  Right half: high/low, precip chance + amount, sunrise/sunset, and rules-driven
  "Heads Up" highlights from the upcoming forecast.
-->

<script>
    // Scene drawing + helpers shared with the panel script below (pushed to markup_shared).
    window.FunWeather = (() => {
        const TZ = 'America/Chicago';

        // Clothing tiers (deg F, using the period's high by day / low by night)
        const TANK_AT = 90;   // >= tank tops
        const TEE_AT = 72;    // >= t-shirts
        const LONG_AT = 45;   // >= long sleeves, below = coats + hats
        const SCARF_BELOW = 32;
        const WINDY_MPH = 15;
        const EGG_CHANCE = 0.1; // per hour; the pick is stable within the hour

        const asNumber = (v) => (typeof v === 'number' ? v : v == null ? null : parseFloat(String(v)));
        const probPct = (v) => {
            const n = asNumber(v);
            if (!isFinite(n)) return null;
            if (n >= 0 && n < 1) return Math.round(n * 100);
            return Math.max(0, Math.min(100, Math.round(n)));
        };
        const getPeriods = (forecast) => forecast?.periods || forecast?.properties?.periods || [];

        // Small seeded PRNG so drawings (and easter eggs) are stable between refreshes.
        const rng = (seed) => () => {
            seed |= 0; seed = seed + 0x6D2B79F5 | 0;
            let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
            t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
            return ((t ^ t >>> 14) >>> 0) / 4294967296;
        };
        const hash = (s) => { let h = 2166136261; for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0; };

        function localParts(now) {
            const parts = Object.fromEntries(new Intl.DateTimeFormat('en-US', {
                timeZone: TZ, year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', hourCycle: 'h23'
            }).formatToParts(now).map(p => [p.type, p.value]));
            return { year: +parts.year, month: +parts.month, day: +parts.day, hour: +parts.hour };
        }

        // ---------- Data: pick today's (or tonight's) period ----------

        function pickPeriod(forecast, now) {
            const periods = getPeriods(forecast);
            if (periods.length) {
                return periods.find(p => now >= new Date(p.startTime) && now < new Date(p.endTime)) || periods[0];
            }
            const d = Array.isArray(forecast?.daily) ? forecast.daily[0] : null;
            if (!d) throw new Error('No forecast periods');
            const hour = localParts(now).hour;
            const isDaytime = hour >= 6 && hour < 18;
            return {
                name: isDaytime ? 'Today' : 'Tonight',
                isDaytime,
                temperature: asNumber(isDaytime ? (d.high ?? d.tempMax ?? d.max) : (d.low ?? d.tempMin ?? d.min)),
                temperatureUnit: 'F',
                windSpeed: String(d.windSpeed ?? d.wind_speed ?? ''),
                probabilityOfPrecipitation: { value: d.pop ?? d.precipProbability },
                shortForecast: d.shortForecast || d.summary || d.condition || ''
            };
        }

        function analyze(p) {
            const short = String(p.shortForecast || '').toLowerCase();
            const detail = String(p.detailedForecast || '').toLowerCase();
            const first = short.split(' then ')[0];
            let temp = asNumber(p.temperature);
            if (String(p.temperatureUnit || 'F').toUpperCase().startsWith('C')) temp = temp * 9 / 5 + 32;
            const pop = probPct(p.probabilityOfPrecipitation?.value);
            const mph = Math.max(0, ...(String(p.windSpeed || '').match(/\d+/g) || []).map(Number));

            const night = p.isDaytime === false;
            const thunder = /thunder|t-storm|tstorm/.test(short);
            const snowWords = /snow|sleet|flurr|blizzard|freezing|ice/.test(short);
            const wetWords = snowWords || /rain|shower|drizzle|thunder|storm/.test(short);
            const wet = wetWords && ((pop != null && pop >= 40) || !/chance/.test(short) || /likely/.test(short));
            const snow = wet && snowWords && !(temp > 36 && /rain/.test(short));
            const rain = wet && !snow;

            let sky;
            if (wet) sky = 'overcast';
            else if (/partly/.test(first)) sky = 'partly';
            else if (/mostly cloudy|overcast/.test(first) || (/cloudy/.test(first) && !/partly/.test(first))) sky = 'cloudy';
            else if (/mostly (sunny|clear)/.test(first)) sky = 'mostly';
            else if (/sunny|clear|fair|hot/.test(first)) sky = 'clear';
            else sky = 'partly';

            const fog = /fog|haze|smoke|mist/.test(short);
            const windy = mph >= WINDY_MPH || /breezy|windy|gust|blustery/.test(short + ' ' + detail);
            const sunVisible = !night && ['clear', 'mostly', 'partly'].includes(sky) && !fog;
            const tier = !isFinite(temp) ? 'tee' : temp >= TANK_AT ? 'tank' : temp >= TEE_AT ? 'tee' : temp >= LONG_AT ? 'long' : 'coat';

            return {
                start: p.startTime ? new Date(p.startTime) : null,
                end: p.endTime ? new Date(p.endTime) : null,
                temp, pop, mph, night, sky, fog, windy, thunder, rain, snow, tier,
                scarf: isFinite(temp) && temp < SCARF_BELOW,
                sunglasses: sunVisible,
                sunVisible,
                umbrella: rain
            };
        }

        // ---------- Easter eggs ----------

        // Each test gets (w, s): the analyzed weather and seasonal(now), so eggs can step aside for holiday art.
        const EGGS = {
            owl: w => w.night && !w.rain && !w.snow,
            shootingStar: w => w.night && ['clear', 'mostly'].includes(w.sky),
            ufo: w => w.night && !w.rain,
            airplane: w => !w.night && !w.thunder,
            balloon: (w, s) => !w.night && !w.windy && !w.rain && !w.snow && !s.flag,
            geese: w => !w.night && !w.rain,
            birdOnHead: w => !w.night && !w.rain && !w.snow && w.tier !== 'coat',
            kite: (w, s) => !w.night && w.windy && !w.rain && !s.flag,
            rainbow: w => !w.night && w.rain,
            snowman: w => w.snow,
            catInWindow: (w, s) => !w.umbrella && !s.halloween,
            bigfoot: (w, s) => !s.thanksgiving,
            deer: (w, s) => !w.rain && !s.thanksgiving,
            rabbit: (w, s) => !w.rain && !w.snow && !s.easter,
            blackhawks: w => !w.thunder,
            cow: (w, s) => !w.thunder && !s.thanksgiving,
            cowboyHats: w => true,
            castle: w => true,
            alamo: w => true,
            armadillo: w => !w.snow
        };

        // Relative odds among eligible eggs (default 1): house swaps are extra rare
        const EGG_WEIGHT = { castle: 0.2, alamo: 0.2 };

        function pickEgg(w, now) {
            const lp = localParts(now);
            const r = rng(hash(`${lp.year}-${lp.month}-${lp.day}-${lp.hour}`));
            if (r() >= EGG_CHANCE) return null;
            const s = seasonal(now);
            const ok = Object.keys(EGGS).filter(k => EGGS[k](w, s));
            let x = r() * ok.reduce((t, k) => t + (EGG_WEIGHT[k] ?? 1), 0);
            return ok.find(k => (x -= EGG_WEIGHT[k] ?? 1) < 0) || null;
        }

        // Day of month of the nth weekday (dow 0 = Sunday) in a month; n = -1 for the last one.
        function nthWeekday(year, month, dow, n) {
            if (n > 0) return 1 + (dow - new Date(Date.UTC(year, month - 1, 1)).getUTCDay() + 7) % 7 + (n - 1) * 7;
            const last = new Date(Date.UTC(year, month, 0));
            return last.getUTCDate() - (last.getUTCDay() - dow + 7) % 7;
        }

        // Western Easter (anonymous Gregorian algorithm) -> [month, day]
        function easter(y) {
            const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4;
            const g = Math.floor((b - Math.floor((b + 8) / 25) + 1) / 3);
            const h = (19 * a + b - d - g + 15) % 30, l = (32 + 2 * e + 2 * Math.floor(c / 4) - h - c % 4) % 7;
            const n = h + l - 7 * Math.floor((a + 11 * h + 22 * l) / 451) + 114;
            return [Math.floor(n / 31), n % 31 + 1];
        }

        function seasonal(now) {
            const { year, month, day, hour } = localParts(now);
            const on = (m, d) => month === m && day === d;
            const memorial = on(5, nthWeekday(year, 5, 1, -1));
            // Flag days: Presidents, Memorial, Flag Day, Independence Day, Labor, Patriot, Veterans
            const flagDay = on(2, nthWeekday(year, 2, 1, 3)) || memorial || on(6, 14) || on(7, 3) || on(7, 4)
                || on(9, nthWeekday(year, 9, 1, 1)) || on(9, 11) || on(11, 11);
            const [em, ed] = easter(year);
            return {
                pumpkin: month === 10 && day >= 15,
                halloween: on(10, 31),
                thanksgiving: on(11, nthWeekday(year, 11, 4, 4)),
                wreath: month === 12 && day <= 26,
                lights: month === 12 || on(1, 1),
                santa: on(12, 24) || on(12, 25),
                fireworks: on(7, 4) || on(12, 31) || on(1, 1),
                party: on(2, 17) || on(7, 13),
                // Half-staff on Patriot Day and until noon on Memorial Day
                flag: !flagDay ? null : on(9, 11) || (memorial && hour < 12) ? 'half' : 'full',
                easter: on(em, ed),
                valentine: on(2, 14),
                stPatrick: on(3, 17),
                groundhog: on(2, 2)
            };
        }

        // ---------- SVG helpers ----------

        const f = (n) => Math.round(n * 10) / 10;

        // Catmull-Rom through points -> dense polyline
        function spline(pts, closed = true, steps = 6) {
            const n = pts.length, out = [];
            const get = i => closed ? pts[(i + n) % n] : pts[Math.max(0, Math.min(n - 1, i))];
            const segs = closed ? n : n - 1;
            for (let i = 0; i < segs; i++) {
                const p0 = get(i - 1), p1 = get(i), p2 = get(i + 1), p3 = get(i + 2);
                for (let s = 0; s < steps; s++) {
                    const t = s / steps, t2 = t * t, t3 = t2 * t;
                    out.push([0, 1].map(k => 0.5 * ((2 * p1[k]) + (-p0[k] + p2[k]) * t
                        + (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * t2
                        + (-p0[k] + 3 * p1[k] - 3 * p2[k] + p3[k]) * t3)));
                }
            }
            if (!closed) out.push(pts[n - 1]);
            return out;
        }

        const poly = (pts, closed = true) => 'M' + pts.map(p => `${f(p[0])} ${f(p[1])}`).join(' L') + (closed ? ' Z' : '');

        // Jagged outline for hair/beard/foliage
        function fuzz(pts, amp, r, closed = true) {
            const n = pts.length;
            return poly(pts.map((p, i) => {
                const a = pts[(i - 1 + n) % n], b = pts[(i + 1) % n];
                const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy) || 1;
                const k = (i % 2 ? 1 : -0.5) * amp * (0.5 + r());
                return [p[0] - dy / L * k, p[1] + dx / L * k];
            }), closed);
        }

        const W = 'fill="#fff"';
        const BLK = 'fill="#000"';
        const thin = (w = 1.3) => `stroke-width="${w}"`;
        // Draw sky marks with a white halo so they read on both day (white) and night (black) skies.
        const halo = (inner, w = 6) => `<g stroke="#fff" stroke-width="${w}">${inner}</g><g>${inner}</g>`;

        const HORIZON = 268;
        const HIM_DY = 16; // shifts him down so our heads are level

        // ---------- Sky ----------

        function sun(cx, cy) {
            const rays = Array.from({ length: 12 }, (_, i) => {
                const a = i * Math.PI / 6, c = Math.cos(a), s = Math.sin(a);
                const r1 = 28, r2 = i % 2 ? 36 : 42;
                return `<line x1="${f(cx + r1 * c)}" y1="${f(cy + r1 * s)}" x2="${f(cx + r2 * c)}" y2="${f(cy + r2 * s)}"/>`;
            }).join('');
            return `<g stroke-width="3">${rays}<circle cx="${cx}" cy="${cy}" r="21" ${W}/></g>`;
        }

        // True new/full moon times (Meeus, Astronomical Algorithms ch. 49), accurate to a few minutes.
        // k is an integer for new moons, integer + 0.5 for full moons. Returns a Julian Day.
        function lunarPhaseJD(k) {
            const rad = Math.PI / 180, T = k / 1236.85, full = k % 1 !== 0;
            const E = 1 - 0.002516 * T - 0.0000074 * T * T;
            const M = (2.5534 + 29.1053567 * k) * rad;
            const Mp = (201.5643 + 385.81693528 * k + 0.0107582 * T * T) * rad;
            const F = (160.7108 + 390.67050284 * k - 0.0016118 * T * T) * rad;
            const O = (124.7746 - 1.56375588 * k) * rad;
            const sin = Math.sin;
            const c = full
                ? -0.40614 * sin(Mp) + 0.17302 * E * sin(M) + 0.01614 * sin(2 * Mp) + 0.01043 * sin(2 * F)
                  + 0.00734 * E * sin(Mp - M) - 0.00515 * E * sin(Mp + M) + 0.00209 * E * E * sin(2 * M)
                  - 0.00111 * sin(Mp - 2 * F) - 0.00057 * sin(Mp + 2 * F) + 0.00056 * E * sin(2 * Mp + M)
                  - 0.00042 * sin(3 * Mp) + 0.00042 * E * sin(M + 2 * F) + 0.00038 * E * sin(M - 2 * F)
                  - 0.00024 * E * sin(2 * Mp - M) - 0.00017 * sin(O)
                : -0.4072 * sin(Mp) + 0.17241 * E * sin(M) + 0.01608 * sin(2 * Mp) + 0.01039 * sin(2 * F)
                  + 0.00739 * E * sin(Mp - M) - 0.00514 * E * sin(Mp + M) + 0.00208 * E * E * sin(2 * M)
                  - 0.00111 * sin(Mp - 2 * F) - 0.00057 * sin(Mp + 2 * F) + 0.00056 * E * sin(2 * Mp + M)
                  - 0.00042 * sin(3 * Mp) + 0.00042 * E * sin(M + 2 * F) + 0.00038 * E * sin(M - 2 * F)
                  - 0.00024 * E * sin(2 * Mp - M) - 0.00017 * sin(O);
            return 2451550.09766 + 29.530588861 * k + 0.00015437 * T * T + c;
        }

        // p: 0 = new, 0.5 = full. full: the full moon lands on this local date or within the current period.
        function moonInfo(now, w) {
            const jd = now / 864e5 + 2440587.5;
            let k = Math.floor((jd - 2451550.09766) / 29.530588861);
            while (lunarPhaseJD(k) > jd) k--;
            while (lunarPhaseJD(k + 1) <= jd) k++;
            const n0 = lunarPhaseJD(k), n1 = lunarPhaseJD(k + 1);
            const fullAt = new Date((lunarPhaseJD(k + 0.5) - 2440587.5) * 864e5);
            const a = localParts(fullAt), b = localParts(now);
            const sameDay = a.year === b.year && a.month === b.month && a.day === b.day;
            const inPeriod = w.start && w.end && fullAt >= w.start && fullAt < w.end;
            return { p: (jd - n0) / (n1 - n0), full: sameDay || inPeriod };
        }

        function moon(cx, cy, now, w) {
            const { p, full } = moonInfo(now, w);
            if (full) {
                // Full moon night: bigger moon with craters, glowing rings and sparkles
                const r = 24;
                const sparkle = (x, y, k) => `<path d="M${x} ${y - k} V${y + k} M${x - k} ${y} H${x + k}" stroke="#fff" ${thin(1.6)}/>`;
                return `<circle cx="${cx}" cy="${cy}" r="${r + 8}" stroke="#fff" ${thin(1.5)} stroke-dasharray="3 4"/>`
                    + `<circle cx="${cx}" cy="${cy}" r="${r + 15}" stroke="#fff" ${thin(1.2)} stroke-dasharray="1.5 5"/>`
                    + `<circle cx="${cx}" cy="${cy}" r="${r}" ${W} stroke="#fff"/>`
                    + `<circle cx="${cx - 8}" cy="${cy - 6}" r="5" ${thin(1.3)}/><circle cx="${cx + 7}" cy="${cy + 7}" r="6.5" ${thin(1.3)}/>`
                    + `<circle cx="${cx + 9}" cy="${cy - 10}" r="2.5" ${thin(1.2)}/><circle cx="${cx - 9}" cy="${cy + 11}" r="2" ${thin(1.2)}/>`
                    + sparkle(cx + 46, cy - 26, 5) + sparkle(cx - 40, cy + 34, 4) + sparkle(cx + 40, cy + 36, 3);
            }
            const r = 19;
            const rx = f(Math.abs(Math.cos(2 * Math.PI * p)) * r);
            const waxing = p < 0.5;
            const outer = waxing ? 1 : 0;
            const inner = waxing ? (p < 0.25 ? 0 : 1) : (p < 0.75 ? 0 : 1);
            const lit = `M${cx} ${cy - r} A${r} ${r} 0 0 ${outer} ${cx} ${cy + r} A${rx} ${r} 0 0 ${inner} ${cx} ${cy - r} Z`;
            return `<circle cx="${cx}" cy="${cy}" r="${r}" stroke="#fff" ${thin(1.2)} stroke-dasharray="2 4"/>`
                + `<path d="${lit}" ${W} stroke="#fff" ${thin(1.5)}/>`;
        }

        function stars(r) {
            let out = '';
            for (let i = 0; i < 26; i++) {
                const x = 8 + r() * 384, y = 8 + r() * 200;
                if (Math.hypot(x - 62, y - 58) < 46) continue;
                if (i % 6 === 0) {
                    out += `<path d="M${f(x)} ${f(y - 5)} V${f(y + 5)} M${f(x - 5)} ${f(y)} H${f(x + 5)}" stroke="#fff" ${thin(1.6)}/>`;
                } else {
                    out += `<circle cx="${f(x)}" cy="${f(y)}" r="${f(1 + r() * 0.9)}" fill="#fff" stroke="none"/>`;
                }
            }
            return out;
        }

        // Cloud: thick outline pass then white fill pass = one clean union outline.
        function cloud(x, y, s = 1) {
            const shapes = `<rect x="-34" y="-2" width="68" height="24" rx="12"/><circle cx="6" cy="-4" r="17"/><circle cx="-14" cy="2" r="11"/><circle cx="22" cy="4" r="10"/>`;
            return `<g transform="translate(${x} ${y}) scale(${s})">`
                + `<g fill="#fff" stroke-width="${f(5 / s)}">${shapes}</g><g fill="#fff" stroke="none">${shapes}</g></g>`;
        }

        function clouds(w) {
            const sets = {
                clear: [],
                mostly: [[318, 52, 0.9]],
                partly: [[318, 50, 1], [148, 34, 0.75], [96, 92, 0.6]],
                cloudy: [[60, 50, 1.05], [170, 28, 0.9], [300, 46, 1.1], [360, 100, 0.7], [110, 110, 0.7]],
                overcast: [[50, 40, 1.15], [150, 26, 1], [262, 34, 1.15], [360, 56, 1], [96, 96, 0.8], [318, 108, 0.8]]
            };
            return (sets[w.sky] || []).map(c => cloud(...c)).join('');
        }

        function windLines() {
            const lines = [
                'M262 128 H350 A10 10 0 1 0 340 118',
                'M18 146 H92 A9 9 0 1 1 83 155',
                'M300 158 H386',
                'M24 172 H70'
            ].map(d => `<path d="${d}"/>`).join('');
            const leaf = (x, y, a) => `<g transform="translate(${x} ${y}) rotate(${a})"><path d="M0 0 Q8 -7 16 0 Q8 7 0 0 Z M0 0 H18" ${W}/></g>`;
            return halo(`<g stroke-width="2.5">${lines}</g>`) + leaf(366, 132, -20) + leaf(108, 168, 25);
        }

        function rainLines(r) {
            let d = '';
            for (let y = 6; y < 300; y += 24) {
                for (let x = (y / 24 % 2) * 12; x < 410; x += 24) {
                    const jx = x + r() * 8, jy = y + r() * 8;
                    d += `M${f(jx)} ${f(jy)} l-5 13 `;
                }
            }
            return halo(`<path d="${d}" stroke-width="2"/>`, 5);
        }

        function snowflakes(r) {
            let out = '';
            for (let i = 0; i < 34; i++) {
                const x = 6 + r() * 388, y = 6 + r() * 290, s = 3 + r() * 2.5;
                out += `<path d="M${f(x - s)} ${f(y)} H${f(x + s)} M${f(x - s * .5)} ${f(y - s * .87)} L${f(x + s * .5)} ${f(y + s * .87)} M${f(x - s * .5)} ${f(y + s * .87)} L${f(x + s * .5)} ${f(y - s * .87)}"/>`;
            }
            return halo(`<g stroke-width="1.8">${out}</g>`, 5);
        }

        function fogLines() {
            const rows = [[176, 10], [200, 40], [226, 0], [250, 30]];
            return halo(rows.map(([y, o]) => `<path d="M${-20 + o} ${y} H420" stroke-dasharray="46 14"/>`).join(''), 6);
        }

        const bolt = `<path d="M232 62 L214 96 L228 96 L218 124 L246 86 L231 86 L242 62 Z" ${BLK} stroke="#fff" stroke-width="2"/>`;

        // ---------- Background: house, trees ----------

        function farm(w, r, season, egg) {
            let s = '';
            // Ground
            s += `<path d="M0 ${HORIZON} H400"/>`;
            const tick = Array.from({ length: 14 }, (_, i) => { const x = 6 + i * 29 + r() * 10; return `M${f(x)} ${HORIZON + 6} l3 -5 l3 5`; }).join(' ');
            s += `<path d="${tick}" ${thin(1.2)}/>`;

            // Tall tree + bush (left)
            s += `<path d="M26 ${HORIZON} V238 M26 252 L18 244" stroke-width="3"/>`;
            const poplar = spline([[26, 164], [38, 182], [43, 210], [38, 236], [26, 244], [14, 236], [9, 210], [14, 182]], true, 5);
            s += `<path d="${fuzz(poplar, 1.4, r)}" ${W}/>`;
            s += `<path d="M20 190 q3 -3 6 0 M28 206 q3 -3 6 0 M18 220 q3 -3 6 0 M28 230 q3 -3 6 0" ${thin(1.2)}/>`;
            const bush = spline([[40, 252], [50, 238], [64, 236], [76, 246], [80, 262], [70, 268], [44, 268], [36, 262]], true, 4);
            s += `<path d="${fuzz(bush, 1.3, r)}" ${W}/>`;
            s += `<path d="M52 250 q3 -3 6 0 M64 256 q3 -3 6 0" ${thin(1.2)}/>`;

            // Tree (right)
            s += `<path d="M356 ${HORIZON} V226 M356 244 L344 232 M356 238 L368 228" stroke-width="3"/>`;
            const canopy = spline([[356, 186], [380, 194], [392, 214], [386, 236], [362, 242], [338, 238], [326, 218], [334, 196]], true, 5);
            s += `<path d="${fuzz(canopy, 1.6, r)}" ${W}/>`;
            s += `<path d="M346 206 q4 -4 8 0 M366 216 q4 -4 8 0 M342 226 q4 -4 8 0 M362 232 q3 -3 6 0" ${thin(1.2)}/>`;

            s += egg === 'castle' ? castle(w) : egg === 'alamo' ? alamo(w) : farmhouse(w, season);

            if (season.wreath) {
                s += `<circle cx="200" cy="234" r="7" ${W} stroke-width="3" stroke-dasharray="3 2"/><path d="M196 242 l4 -3 l4 3" ${thin(1.5)}/>`;
            }
            if (season.pumpkin) {
                // Carved on Halloween
                const face = season.halloween
                    ? `<path d="M-6 -2 l2 -3.5 l2 3.5 Z M2 -2 l2 -3.5 l2 3.5 Z M-6 1.5 Q0 6.5 6 1.5 L4 3 L2 2 L0 3.5 L-2 2 L-4 3 Z" ${BLK} ${thin(0.8)}/>`

                        + `<path d="M13 -4 Q22 -3 29 1 Q21 0 13 -1 Z" ${W} ${thin(1.3)}/><path d="M-9 -1 V1.5 M-4 -1 V1.5 M5 -1 V1.5 M10 -1 V1.5" stroke-width="2.2"/>`
                        + `<path d="M-15 0 Q-15 -14 0 -14 Q15 -14 15 0 Z" ${W} stroke-width="2"/>`
                        + `<path d="M-5 -13.2 Q-6 -6 -5.5 0 M-1.5 -13.9 V0 M2 -13.9 V0 M5.5 -13.2 Q6.5 -6 6 0" ${thin(1)}/>`
                        + `<g ${BLK} stroke="none">${[[-10, -8], [-12, -3.5], [-8, -4], [-8.5, -10], [10, -8], [12, -3.5], [8.5, -4], [9, -10]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r=".8"/>`).join('')}</g>`
                        + `<path d="M-16 -9 L-17 -15 L-13 -10" ${W} ${thin(1.2)}/>`
                        + `<path d="M-13 -9 Q-17 -9 -27 -2 Q-27 0 -25 0 H-13 Z" ${W} stroke-width="1.6"/><circle cx="-18" cy="-5" r=".8" ${BLK}/></g>`;
                default:
                    return '';
            }
        }

        // ---------- Holiday + new egg drawings ----------

        // US flag on a yard pole right of the house (behind the tree); half = half-staff
        function usFlag(half) {
            const px = 342, H = 32 / 13;
            const shape = 'M0 0 Q12.5 -4 25 0 T50 0 V32 Q37.5 36 25 32 T0 32 Z';
            const wave = (y) => `M0 ${f(y)} Q12.5 ${f(y - 4)} 25 ${f(y)} T50 ${f(y)}`;
            let red = '', stars = '';
            for (let i = 0; i < 13; i += 2) red += wave(H * (i + 0.5)) + ' ';
            for (let i = 0; i < 4; i++) for (let j = 0; j < 5; j++) {
                const x = 2.4 + j * 3.9 + (i % 2) * 1.3, y = 2.4 + i * 4.1 - 8 * (x / 25) * (1 - x / 25);
                stars += `<circle cx="${f(x)}" cy="${f(y)}" r="0.9"/>`;
            }
            return `<defs><clipPath id="flagClip"><path d="${shape}"/></clipPath><clipPath id="cantonClip"><rect x="0" y="-6" width="21" height="40"/></clipPath></defs>`
                + halo(`<path d="M${px} ${HORIZON} V88"/>`, 6) + `<circle cx="${px}" cy="86" r="3" ${W} ${thin(1.6)}/>`
                + `<g transform="translate(${px} ${half ? 138 : 96})"><path d="${shape}" ${W} stroke="#fff" stroke-width="5"/>`
                + `<g clip-path="url(#flagClip)"><path d="${red}" stroke-width="${f(H)}" stroke-linecap="butt"/>`
                + `<g clip-path="url(#cantonClip)"><path d="${wave(8.6)}" stroke-width="17.6" stroke-linecap="butt"/></g>`
                + `<g fill="#fff" stroke="none">${stars}</g></g><path d="${shape}" ${thin(1.6)}/></g>`;
        }

        // Black with a white edge on day skies, solid white at night (lit)
        const bat = (x, y, s, lit) => `<path transform="translate(${f(x)} ${f(y)}) scale(${f(s)})" d="M0 -2 L-1.5 -4 L-1 -1 Q-4 -4 -8 -3 Q-11 -4 -13 -1 Q-10 -1 -9 2 Q-7 0 -5 2 Q-3 0 0 3 Q3 0 5 2 Q7 0 9 2 Q10 -1 13 -1 Q11 -4 8 -3 Q4 -4 1 -1 L1.5 -4 Z" ${lit ? 'fill="#fff" stroke="none"' : `${BLK} stroke="#fff" stroke-width="${f(0.8 / s)}"`}/>`;
        const heart = (x, y, s) => `<path transform="translate(${x} ${y}) scale(${s})" d="M0 6 C-8 0 -10 -6 -5 -9 C-2 -11 0 -9 0 -7 C0 -9 2 -11 5 -9 C10 -6 8 0 0 6 Z" ${BLK} stroke="#fff" stroke-width="${f(1.5 / s)}"/>`;

        // Decorated eggs hidden in the grass
        function easterEggs() {
            const deco = [
                `<path d="M-5 0 l2 -2.5 l2 2.5 l2 -2.5 l2 2.5 l2 -2.5" ${thin(1.3)}/>`,
                `<path d="M-4.4 -3 H4.4 M-4.4 3 H4.4" stroke-width="2"/>`,
                `<g ${BLK} stroke="none"><circle cx="0" cy="-3.5" r="1.1"/><circle cx="-2.4" cy="0.5" r="1.1"/><circle cx="2.4" cy="0.5" r="1.1"/><circle cx="0" cy="4" r="1.1"/></g>`,
                `<path d="M-5 0 H5" stroke="#fff" stroke-width="2"/>`
            ];
            return [[178, 284, -15, 0], [198, 294, 12, 2], [218, 286, -8, 1], [24, 286, 10, 3], [48, 293, -12, 0], [348, 288, 8, 1], [372, 296, -10, 2], [386, 280, 6, 3]]
                .map(([x, y, a, k]) => `<g transform="translate(${x} ${y}) rotate(${a})"><ellipse rx="5.2" ry="6.8" ${k === 3 ? BLK : W} ${thin(1.6)}/>${deco[k]}</g>`).join('');
        }

        // Groundhog Day: out of his hole, with a shadow if the sun is out
        function groundhog(w) {
            let s = w.sunVisible ? `<path d="M205 277 Q220 274 234 278 Q220 282 205 280 Z" ${BLK} stroke="none"/>` : '';
            s += `<ellipse cx="186" cy="277" rx="15" ry="4.5" ${BLK}/>`;
            return s + `<g transform="translate(186 276)">`
                + `<circle cx="-6" cy="-26" r="2.8" ${W} ${thin(1.4)}/><circle cx="6" cy="-26" r="2.8" ${W} ${thin(1.4)}/>`
                + `<path d="M-10 0 Q-12 -17 -7 -25 Q0 -32 7 -25 Q12 -17 10 0 Z" ${W} stroke-width="2"/>`
                + `<circle cx="-3.2" cy="-21" r="1.3" ${BLK}/><circle cx="3.2" cy="-21" r="1.3" ${BLK}/><ellipse cx="0" cy="-17" rx="2" ry="1.4" ${BLK}/>`
                + `<path d="M-1.4 -15 h2.8 v2.6 h-2.8 Z M0 -15 v2.6" ${W} ${thin(0.9)}/><path d="M-7 -8 q2.5 2 5 0 M2 -8 q2.5 2 5 0" ${thin(1.4)}/></g>`;
        }

        function turkey() {
            let t = '';
            for (let i = 0; i < 9; i++) {
                t += `<g transform="translate(8 -26) rotate(${-80 + i * 20})"><path d="M0 -6 Q-6 -16 -4 -28 Q0 -33 4 -28 Q6 -16 0 -6 Z" ${W} ${thin(1.8)}/><path d="M-3 -24 Q0 -27 3 -24" stroke-width="2.6"/></g>`;
            }
            t += `<path d="M-2 -7 V0 M7 -7 V0 M-6 0 h6 M3 0 h7" stroke-width="2"/>`
                + `<path d="M-14 -18 Q-14 -34 2 -34 Q18 -34 18 -18 Q18 -6 2 -6 Q-14 -6 -14 -18 Z" ${W} stroke-width="2"/>`
                + `<path d="M0 -26 q6 4 12 0 M2 -19 q6 4 12 0" ${thin(1.2)}/>`
                + `<path d="M-8 -24 Q-18 -32 -16 -44 L-10 -44 Q-12 -34 -4 -28 Z" ${W} stroke-width="1.8"/>`
                + `<circle cx="-14" cy="-47" r="4.5" ${W} stroke-width="1.8"/><path d="M-18 -48 l-5 1.5 l5 1.5 Z" ${W} ${thin(1.2)}/>`
                + `<path d="M-17.5 -44 q-3 5 0 10" stroke-width="2.6"/><circle cx="-13" cy="-48.5" r="1" ${BLK}/>`;
            return `<g transform="translate(350 ${HORIZON})">${halo(t, 6)}</g>`;
        }

        function fireworks() {
            const burst = (cx, cy, rad) => Array.from({ length: 10 }, (_, i) => {
                const a = i * Math.PI / 5, c = Math.cos(a), s = Math.sin(a);
                return `M${f(cx + rad * .35 * c)} ${f(cy + rad * .35 * s)} L${f(cx + rad * c)} ${f(cy + rad * s)}`;
            }).join(' ');
            return `<path d="${burst(150, 40, 22)} ${burst(320, 90, 18)} ${burst(250, 26, 14)}" stroke="#fff" stroke-width="2"/>`;
        }

        // ---------- Compose ----------

        // look: optional overrides for previews, e.g. { swim: true, shirt: 'apple' }
        function drawScene(w, egg, now, look = {}) {
            const r = rng(42);
            const season = seasonal(now);
            // Outfit rolls, stable for the day: occasional swimsuits on hot days and an occasional print on his tee
            const lp = localParts(now), roll = rng(hash(`look-${lp.year}-${lp.month}-${lp.day}`)), r1 = roll(), r2 = roll(), r3 = roll();
            season.swim = look.swim ?? (w.tier === 'tank' && r1 < SWIM_CHANCE);
            season.shirt = look.shirt ?? (r2 < SHIRT_CHANCE ? SHIRTS[Math.floor(r3 * SHIRTS.length)] : 'plain');
            // Lift the umbrella to clear tall hats
            const canopyDy = [hatFor('her', w, season, egg), hatFor('him', w, season, egg)].some(h => h && h !== 'beanie') ? -24 : 0;
            let s = '';

            if (w.night) s += `<rect x="0" y="0" width="400" height="${HORIZON}" ${BLK} stroke="none"/>`;
            if (egg === 'rainbow') s += eggArt(egg, w);

            // Sky
            if (w.night) {
                if (w.sky !== 'overcast' && w.sky !== 'cloudy') s += stars(rng(7));
                if (w.sky !== 'overcast') s += moon(62, 58, now, w);
                if (season.fireworks) s += fireworks();
            } else if (w.sunVisible) {
                s += sun(62, 58);
            }
            if (['airplane', 'balloon', 'geese', 'kite', 'shootingStar', 'ufo'].includes(egg)) s += eggArt(egg, w);
            s += clouds(w);
            if (season.flag) s += usFlag(season.flag === 'half');
            if (season.valentine) s += heart(250, 40, 1.6) + heart(312, 84, 1.1) + heart(172, 28, 1) + heart(124, 104, 0.8) + heart(372, 28, 0.9);
            if (season.halloween) s += [[140, 34, 1.3], [176, 66, 1], [300, 36, 1.2], [338, 76, 0.9], [252, 24, 0.8]].map(([x, y, k]) => bat(x, y, k, w.night)).join('');
            if (egg === 'blackhawks') s += eggArt(egg, w);
            if (w.thunder && w.rain) s += bolt;
            if (w.windy) s += windLines();

            // Farm
            s += farm(w, r, season, egg);
            if (['owl', 'catInWindow', 'snowman', 'bigfoot', 'deer', 'rabbit', 'cow', 'armadillo'].includes(egg)) s += eggArt(egg, w);
            if (season.easter) s += easterEggs() + eggArt('rabbit', w);
            if (season.groundhog) s += groundhog(w);
            if (season.thanksgiving) s += turkey();
            if (season.stPatrick) s += [[176, 286, 1], [216, 296, 0.9], [30, 290, 1], [56, 282, 0.8], [350, 290, 1], [380, 284, 0.8]].map(p => shamrock(...p)).join('');
            if (w.fog) s += fogLines();

            // Precip (behind us, kept out from under the umbrella)
            if (w.rain) {
                s += `<defs><mask id="dry"><rect width="400" height="480" fill="#fff"/><path d="M36 ${182 + canopyDy} H364 V480 H36 Z" fill="#000"/></mask></defs>`;
                s += `<g mask="${w.umbrella ? 'url(#dry)' : ''}">${rainLines(rng(11))}</g>`;
            }
            if (w.snow) s += snowflakes(rng(13));

            // Us
            s += her(w, rng(5), season, egg);
            s += `<g transform="translate(0 ${HIM_DY})">${him(w, rng(9), egg, season)}</g>`;
            if (w.umbrella) s += `<g transform="translate(0 ${canopyDy})">${umbrellaCanopy()}</g>`;

            // Frame
            s += `<rect x="1.5" y="1.5" width="397" height="477" stroke-width="3"/>`;

            const dress = season.swim ? 'swimsuits' : { tank: 'tank tops', tee: 't-shirts', long: 'long sleeves', coat: 'coats and hats' }[w.tier];
            const label = `The two of us in ${dress}${w.umbrella ? ' under an umbrella' : ''}${w.sunglasses ? ' and sunglasses' : ''}, ${w.night ? 'at night' : 'by day'}`;
            return `<svg viewBox="0 0 400 480" width="400" height="480" role="img" aria-label="${label}" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">${s}</svg>`;
        }

        return {
            TZ, asNumber, probPct, localParts, getPeriods, pickPeriod, analyze, pickEgg, f, drawScene,
            // For scripts/preview-scene.js
            EGG_NAMES: Object.keys(EGGS), nthWeekday, easter
        };
    })();
</script>

<script>
    ; (() => {
        if (!window.FunWeather) {
            document.getElementById('scene').innerHTML = '<div style="padding:16px; font:700 24px system-ui">Render error</div><div style="padding:0 16px; font:400 18px system-ui">Shared markup (FunWeather) did not load</div>';
            return;
        }
        const { TZ, asNumber, probPct, localParts, getPeriods, pickPeriod, analyze, pickEgg, f, drawScene } = window.FunWeather;

        // ---------- Right panel: numbers ----------

        // Highlight thresholds (deg F, %, mph)
        const LOOKAHEAD_DAYS = 6;
        const SWING_F = 15;        // day-to-day change in highs
        const FREEZE_F = 32;
        const HARD_FREEZE_F = 28;
        const HEAT_F = 100;
        const HEAT_INDEX_F = 108;
        const RAIN_POP = 40;
        const STORM_POP = 30;
        const SNOW_POP = 30;
        const WIND_HL_MPH = 25;    // sustained
        const GUST_HL_MPH = 35;
        const HEAVY_RAIN_IN = 1;   // liquid inches in one period
        // Official NWS alerts by severity (they outrank the rules below)
        const ALERT_SCORE = { Extreme: 130, Severe: 115, Moderate: 85, Minor: 60 };

        const deg = (n) => isFinite(n) ? Math.round(n) + '\u00B0' : '--\u00B0';

        // Whole local days between now and date (0 = today)
        function dayOffset(date, now) {
            const a = localParts(date), b = localParts(now);
            return Math.round((Date.UTC(a.year, a.month - 1, a.day) - Date.UTC(b.year, b.month - 1, b.day)) / 864e5);
        }

        // "today", "tonight", "tomorrow", "tomorrow night", "Saturday", "Saturday night"
        function whenName(p, now) {
            const start = new Date(p.startTime), off = dayOffset(start, now), night = p.isDaytime === false;
            if (off <= 0) return night ? 'tonight' : 'today';
            if (off === 1) return night ? 'tomorrow night' : 'tomorrow';
            const dow = start.toLocaleDateString('en-US', { weekday: 'long', timeZone: TZ });
            return night ? `${dow} night` : dow;
        }

        // NWS puts amounts in the detailed text, e.g. "New rainfall amounts between a tenth and quarter of an inch possible."
        function precipAmount(detail) {
            const words = { 'a tenth': 0.1, tenth: 0.1, 'a quarter': 0.25, quarter: 0.25, 'a half': 0.5, half: 0.5, 'three quarters': 0.75, one: 1, an: 1, a: 1 };
            const num = (s) => { s = s.trim(); return s in words ? words[s] : parseFloat(s); };
            const sentences = String(detail || '').toLowerCase().split('.');
            for (const sent of sentences) {
                const kind = /rainfall/.test(sent) ? 'Rain' : /snow/.test(sent) ? 'Snow' : /ice accum/.test(sent) ? 'Ice' : null;
                if (!kind) continue;
                let m, text = null;
                if ((m = sent.match(/less than (.+?) (?:of an )?inch/))) text = `&lt; ${num(m[1])}`;
                else if ((m = sent.match(/between (.+?) and (.+?) (?:of an )?inch/))) text = `${num(m[1])}\u2013${num(m[2])}`;
                else if ((m = sent.match(/(\d+(?:\.\d+)?) to (\d+(?:\.\d+)?) inch/))) text = `${m[1]}\u2013${m[2]}`;
                else if ((m = sent.match(/(?:around|up to|near) (.+?) (?:of an )?inch/))) text = `~${num(m[1])}`;
                if (text && !/NaN/.test(text)) return { kind, text: `${text} in` };
            }
            return null;
        }

        // 0.72 -> "0.72", 0.5 -> "0.5", 1.26 -> "1.3"
        const inches = (n) => n >= 1 ? n.toFixed(1) : n.toFixed(2).replace(/(\.\d)0$/, '$1');

        // Exact amounts from the API's per-period `precipitation` (grid QPF, inches).
        // undefined = field missing (fall back to text); null = nothing measurable.
        function gridAmount(p) {
            const q = p.precipitation;
            if (!q || typeof q !== 'object') return undefined;
            const snow = +q.snowIn || 0, ice = +q.iceIn || 0, liquid = +q.liquidIn || 0;
            if (snow >= 0.1) return { kind: 'Snow', in: snow, text: `${inches(snow)} in` };
            if (ice >= 0.01) return { kind: 'Ice', in: ice, text: `${inches(ice)} in` };
            if (liquid >= 0.01) return { kind: 'Rain', in: liquid, text: `${inches(liquid)} in` };
            return null;
        }

        function periodInfo(p) {
            const short = String(p.shortForecast || '').toLowerCase();
            const detail = String(p.detailedForecast || '').toLowerCase();
            const grid = gridAmount(p);
            let temp = asNumber(p.temperature);
            if (String(p.temperatureUnit || 'F').toUpperCase().startsWith('C')) temp = temp * 9 / 5 + 32;
            const speeds = (String(p.windSpeed || '').match(/\d+/g) || []).map(Number);
            return {
                p, temp: Math.round(temp),
                pop: probPct(p.probabilityOfPrecipitation?.value) ?? 0,
                wind: Math.max(0, ...speeds),
                gust: +(detail.match(/gusts? (?:as high as|up to|to|around|near) (\d+) mph/) || [])[1] || 0,
                thunder: /thunder|t-storm|tstorm/.test(short),
                severe: /severe/.test(short + ' ' + detail),
                snow: /snow|flurr|blizzard/.test(short) || grid?.kind === 'Snow',
                ice: /sleet|freezing rain|freezing drizzle|\bice\b/.test(short) || grid?.kind === 'Ice',
                rain: /rain|shower|drizzle/.test(short),
                // Fog: 3 = dense, 2 = areas/widespread/plain fog, 1 = patchy
                fog: !/fog/.test(short + ' ' + detail) ? 0
                    : /dense fog/.test(short + ' ' + detail) ? 3
                    : /patchy fog/.test(short + ' ' + detail) && !/(areas of|widespread) fog/.test(short + ' ' + detail) ? 1 : 2,
                fogWhen: (detail.match(/fog (before|after|until|between) (\d{1,2}\s?(?:am|pm)(?: and \d{1,2}\s?(?:am|pm))?)/) || []).slice(1).join(' '),
                heatIndex: +(detail.match(/heat index values? (?:as high as|up to|near|around) (\d+)/) || [])[1] || 0,
                amount: grid !== undefined ? grid : precipAmount(detail)
            };
        }

        // Sunrise/sunset from lat/lon (NOAA sunrise equation, ~1 minute accuracy)
        function sunTimes(lat, lon, now) {
            if (!isFinite(lat) || !isFinite(lon)) return null;
            const { year, month, day } = localParts(now), rad = Math.PI / 180;
            const n = Date.UTC(year, month - 1, day, 12) / 864e5 + 2440587.5 - 2451545;
            const Js = n - lon / 360;
            const M = (357.5291 + 0.98560028 * Js) % 360;
            const C = 1.9148 * Math.sin(M * rad) + 0.02 * Math.sin(2 * M * rad) + 0.0003 * Math.sin(3 * M * rad);
            const L = (M + C + 180 + 102.9372) % 360;
            const Jt = 2451545 + Js + 0.0053 * Math.sin(M * rad) - 0.0069 * Math.sin(2 * L * rad);
            const dec = Math.asin(Math.sin(L * rad) * Math.sin(23.4397 * rad));
            const cosH = (Math.sin(-0.833 * rad) - Math.sin(lat * rad) * Math.sin(dec)) / (Math.cos(lat * rad) * Math.cos(dec));
            if (cosH < -1 || cosH > 1) return null;
            const H = Math.acos(cosH) / rad / 360;
            const toDate = (J) => new Date((J - 2440587.5) * 864e5);
            return { rise: toDate(Jt - H), set: toDate(Jt + H) };
        }

        const clock = (d) => {
            const [t, ap] = d.toLocaleTimeString('en-US', { timeZone: TZ, hour: 'numeric', minute: '2-digit' }).split(/\s+/);
            return `${t}<small>${ap}</small>`;
        };

        // ---------- Right panel: icons ----------

        const ICONS = {
            thermo: `<svg viewBox="0 0 48 52"><path d="M19 34 V10 a5 5 0 0 1 10 0 V34"/><circle cx="24" cy="40" r="9"/><circle cx="24" cy="40" r="5" fill="#000" stroke="none"/><path d="M24 36 V18" stroke-width="4"/><path d="M33 14 h6 M33 22 h6 M33 30 h6" stroke-width="2"/></svg>`,
            drop: (pop) => {
                const top = 47 - 40 * Math.min(100, pop) / 100;
                const d = 'M24 5 C24 5 9 23 9 32 a15 15 0 0 0 30 0 C39 23 24 5 24 5 Z';
                return `<svg viewBox="0 0 48 52"><defs><clipPath id="popFill"><rect x="0" y="${f(top)}" width="48" height="52"/></clipPath></defs>`
                    + `<path d="${d}" fill="#000" stroke="none" clip-path="url(#popFill)"/><path d="${d}"/></svg>`;
            },
            sun: (up) => `<svg viewBox="0 0 40 40"><path d="M3 31 H37"/><path d="M12 31 a8 8 0 0 1 16 0"/>`
                + `<path d="M5 25 l3 1.5 M35 25 l-3 1.5 M10 17 l2.5 2.5 M30 17 l-2.5 2.5" stroke-width="2.5"/>`
                + (up ? `<path d="M20 20 V5 M15 10 l5 -5 l5 5" stroke-width="2.5"/>` : `<path d="M20 5 V20 M15 15 l5 5 l5 -5" stroke-width="2.5"/>`)
                + `<path d="M9 36 H31" stroke-width="2"/></svg>`
        };

        const HL_ICONS = {
            storm: `<path d="M8 20 a6 6 0 0 1 1 -12 a8 8 0 0 1 15 2 a5 5 0 0 1 0 10 Z"/><path d="M16 17 L12 25 H17 L14 31 L21 22 H16 L19 17 Z" fill="#000" stroke-width="1.5"/>`,
            rain: `<path d="M16 3 C16 3 6 15 6 21 a10 10 0 0 0 20 0 C26 15 16 3 16 3 Z"/>`,
            snow: `<path d="M16 3 V29 M4.7 9.5 L27.3 22.5 M4.7 22.5 L27.3 9.5 M12 5 l4 3 l4 -3 M12 27 l4 -3 l4 3"/>`,
            freeze: `<path d="M11 20 V6 a3.5 3.5 0 0 1 7 0 V20"/><circle cx="14.5" cy="24" r="5.5" fill="#000"/><path d="M24 4 V14 M19.7 6.5 L28.3 11.5 M19.7 11.5 L28.3 6.5" stroke-width="2"/>`,
            cool: `<path d="M9 20 V6 a3.5 3.5 0 0 1 7 0 V20"/><circle cx="12.5" cy="24" r="5.5" fill="#000"/><path d="M25 5 V26 M20 21 l5 5 l5 -5"/>`,
            warm: `<path d="M9 20 V6 a3.5 3.5 0 0 1 7 0 V20"/><circle cx="12.5" cy="24" r="5.5" fill="#000"/><path d="M25 26 V5 M20 10 l5 -5 l5 5"/>`,
            heat: `<circle cx="16" cy="16" r="6"/><path d="M16 2 V6 M16 26 V30 M2 16 H6 M26 16 H30 M6 6 l3 3 M23 23 l3 3 M26 6 l-3 3 M9 23 l-3 3"/>`,
            wind: `<path d="M3 11 H20 a4 4 0 1 0 -4 -4 M3 18 H25 a4 4 0 1 1 -4 4 M3 25 H14"/>`,
            fog: `<path d="M9 13 a5 5 0 0 1 1 -9 a7 7 0 0 1 13 2 a4 4 0 0 1 0 7"/><path d="M3 18 H24 M8 23 H29 M3 28 H20" stroke-width="2.5"/>`,
            calm: `<path d="M4 16 a12 12 0 0 1 24 0"/><path d="M2 22 H30 M7 27 H25"/>`,
            alert: `<path d="M16 2.5 L30.5 28.5 H1.5 Z" fill="#000" stroke-linejoin="round"/><path d="M16 11 V19.5" stroke="#fff" stroke-width="3.2"/><circle cx="16" cy="24" r="2" fill="#fff" stroke="none"/>`
        };
        const hlIcon = (k) => `<svg viewBox="0 0 32 32" aria-hidden="true">${HL_ICONS[k] || ''}</svg>`;

        // ---------- Highlights (alerts + rules) ----------
        // Each rule adds at most one candidate. Score = importance minus 4 per day out; top 3 shown in time order.

        // "7pm", "tomorrow 9am", "Sat 6pm"
        function alertTime(d, now, sameDayAs) {
            const t = d.toLocaleTimeString('en-US', { timeZone: TZ, hour: 'numeric', minute: '2-digit' }).replace(':00', '').replace(/\s+/g, '').toLowerCase();
            if (sameDayAs && dayOffset(d, sameDayAs) === 0) return t;
            const off = dayOffset(d, now);
            if (off <= 0) return t;
            if (off === 1) return `tomorrow ${t}`;
            return `${d.toLocaleDateString('en-US', { weekday: 'short', timeZone: TZ })} ${t}`;
        }

        // Alert event -> highlight kind, so a rule saying the same thing can step aside
        const alertKind = (ev) => /tornado|thunderstorm/i.test(ev) ? 'storm'
            : /fog/i.test(ev) ? 'fog'
            : /freez|frost|cold|chill/i.test(ev) ? 'freeze'
            : /heat/i.test(ev) ? 'heat'
            : /winter|snow|ice|blizzard|sleet/i.test(ev) ? 'snow'
            : /wind|gale/i.test(ev) ? 'wind' : 'other';

        // NWS active alerts from the API (`alerts`: array, [] = none, null = unknown).
        // Text is filled in by alertText() once the rules have run.
        function alertItems(alerts, now) {
            const out = [], seen = new Set();
            const list = (Array.isArray(alerts) ? alerts : [])
                .map(a => ({ a, on: new Date(a?.onset || now), end: a?.ends ? new Date(a.ends) : null }))
                .filter(x => x.a?.event && !isNaN(x.on) && !(x.end && (isNaN(x.end) || x.end <= now)))
                .sort((x, y) => x.on - y.on);
            for (const { a, on, end } of list) {
                const ev = String(a.event).trim();
                if (seen.has(ev)) continue;
                seen.add(ev);
                const score = (ALERT_SCORE[a.severity] ?? 50) - 4 * Math.max(0, dayOffset(on, now));
                out.push({ t: Math.max(+on, +now), icon: 'alert', ev, score, kind: alertKind(ev), on, end, from: +on, to: end ? +end : Infinity, tail: '' });
            }
            return out;
        }

        // Active: "Flood Watch until tomorrow 6pm". Upcoming: "Freeze Warning Sunday night" (or exact times
        // past the forecast). Tail = numbers borrowed from the rule it replaced, e.g. ", low of 29 deg".
        function alertText(x, up, now) {
            if (x.on <= now) return x.end ? `${x.ev} until ${alertTime(x.end, now)}${x.tail}` : `${x.ev} in effect${x.tail}`;
            const p = up.find(y => new Date(y.p.startTime) <= x.on && x.on < new Date(y.p.endTime));
            if (p) return `${x.ev} ${whenName(p.p, now)}${x.tail}`;
            return `${x.ev} from ${alertTime(x.on, now)}${x.end ? ` to ${alertTime(x.end, now, x.on)}` : ''}`;
        }

        function highlights(periods, now, alerts) {
            const up = periods
                .filter(p => new Date(p.endTime) > now && dayOffset(new Date(p.startTime), now) <= LOOKAHEAD_DAYS)
                .map(periodInfo);
            const official = alertItems(alerts, now);
            const items = [];
            const when = (i) => whenName(up[i].p, now);
            const add = (i, score, icon, text) => {
                const s = +new Date(up[i].p.startTime), e = +new Date(up[i].p.endTime);
                const kind = icon === 'cool' || icon === 'warm' ? 'temp' : icon;
                // An official alert of the same kind covering this period says it better; give it our numbers
                const a = official.find(a => a.kind === kind && a.from < e && a.to > s);
                if (a) { if (!a.tail) a.tail = text.match(/(?: \(\d+%\))?(?:, [^,]+)?$/)[0]; return; }
                items.push({ t: Math.max(s, +now), icon, text, score: score - 4 * Math.max(0, dayOffset(new Date(s), now)) });
            };
            // Most significant matching period: value minus 3 per day out (so nearer wins close calls)
            const find = (fn, val = (x) => x.pop) => {
                let best = -1, bestV = -Infinity;
                up.forEach((x, k) => {
                    if (!fn(x)) return;
                    const v = val(x) - 3 * Math.max(0, dayOffset(new Date(x.p.startTime), now));
                    if (v > bestV) { best = k; bestV = v; }
                });
                return best;
            };

            // ", 0.72 in" when a rain amount is known and worth mentioning
            const rainAmt = (x) => x.amount?.kind === 'Rain' && !(x.amount.in < 0.1) ? `, ${x.amount.text}` : '';

            // Storms (severe outranks every rule)
            let i = find(x => x.severe && (x.thunder || x.pop >= STORM_POP));
            if (i >= 0) add(i, 100, 'storm', `Severe storms possible ${when(i)} (${up[i].pop}%)${rainAmt(up[i])}`);
            else if ((i = find(x => x.thunder && x.pop >= STORM_POP)) >= 0) {
                add(i, 80, 'storm', `Storms ${up[i].pop >= 60 ? 'likely' : 'possible'} ${when(i)} (${up[i].pop}%)${rainAmt(up[i])}`);
            }

            // Snow / ice
            if ((i = find(x => (x.snow || x.ice) && x.pop >= SNOW_POP)) >= 0) {
                const x = up[i], amt = x.amount && x.amount.kind !== 'Rain' ? `, ${x.amount.text}` : '';
                add(i, 95, 'snow', `${x.ice ? 'Icy mix' : 'Snow'} possible ${when(i)} (${x.pop}%)${amt}`);
            }

            // Rain (storm periods are covered above)
            if ((i = find(x => x.rain && !x.thunder && x.pop >= RAIN_POP)) >= 0) {
                const x = up[i], heavy = x.amount?.kind === 'Rain' && x.amount.in >= HEAVY_RAIN_IN;
                add(i, heavy ? 85 : 65, 'rain', `${heavy ? 'Heavy rain' : `Rain ${x.pop >= 60 ? 'likely' : 'expected'}`} ${when(i)} (${x.pop}%)${rainAmt(x)}`);
            }

            // Freeze: first freezing night, and how cold it gets
            const freezes = up.map((x, k) => k).filter(k => up[k].p.isDaytime === false && up[k].temp <= FREEZE_F);
            if (freezes.length) {
                const k = freezes[0], lo = Math.min(...freezes.map(j => up[j].temp)), hard = lo <= HARD_FREEZE_F;
                add(k, 90, 'freeze', freezes.length > 1
                    ? `${hard ? 'Hard freeze' : 'Freezing'} nights start ${when(k)}, lows to ${lo}\u00B0`
                    : `${hard ? 'Hard freeze' : 'Freeze'} ${when(k)}, low of ${lo}\u00B0`);
            }

            // Temperature swings between consecutive daytime highs
            const days = up.map((x, k) => k).filter(k => up[k].p.isDaytime !== false);
            let swing = null;
            for (let j = 1; j < days.length; j++) {
                const d = up[days[j]].temp - up[days[j - 1]].temp;
                if (Math.abs(d) >= SWING_F && (!swing || Math.abs(d) > Math.abs(swing.d))) swing = { d, a: up[days[j - 1]].temp, b: up[days[j]].temp, k: days[j] };
            }
            if (swing) {
                add(swing.k, swing.d < 0 ? 75 : 55, swing.d < 0 ? 'cool' : 'warm',
                    `Big temperature ${swing.d < 0 ? 'drop' : 'jump'} ${when(swing.k)}, ${swing.a}\u00B0 \u2192 ${swing.b}\u00B0`);
            }

            // Wind
            if ((i = find(x => x.wind >= WIND_HL_MPH || x.gust >= GUST_HL_MPH, x => Math.max(x.wind, x.gust))) >= 0) {
                const x = up[i], strong = x.wind >= 40 || x.gust >= 58;
                add(i, strong ? 92 : 70, 'wind', `${strong ? 'High winds' : 'Windy'} ${when(i)}, ${x.gust ? `gusts to ${x.gust} mph` : `winds to ${x.wind} mph`}`);
            }

            // Fog (patchy fog is common, so it ranks low unless the week is otherwise quiet)
            if ((i = find(x => x.fog > 0, x => x.fog * 30)) >= 0) {
                const x = up[i], label = ['', 'Patchy fog', 'Fog', 'Dense fog'][x.fog];
                let text = `${label} ${when(i)}${x.fogWhen ? ' ' + x.fogWhen : ''}`;
                if (x.p.isDaytime === false && /am/.test(x.fogWhen) && !/pm/.test(x.fogWhen)) {
                    // Overnight fog "after 3am" belongs to the next morning
                    const next = new Date(new Date(x.p.startTime).getTime() + 864e5), off = dayOffset(next, now);
                    const day = off <= 0 ? 'today' : off === 1 ? 'tomorrow' : next.toLocaleDateString('en-US', { weekday: 'long', timeZone: TZ });
                    text = `${label} early ${day} (${x.fogWhen})`;
                }
                add(i, [0, 40, 55, 72][x.fog], 'fog', text);
            }

            // Heat
            if ((i = find(x => x.p.isDaytime !== false && (x.temp >= HEAT_F || x.heatIndex >= HEAT_INDEX_F), x => Math.max(x.temp, x.heatIndex))) >= 0) {
                const x = up[i];
                add(i, 50, 'heat', x.heatIndex >= HEAT_INDEX_F ? `Heat index up to ${x.heatIndex}\u00B0 ${when(i)}` : `Hot ${when(i)}, high of ${x.temp}\u00B0`);
            }

            official.forEach(x => items.push({ ...x, text: alertText(x, up, now) }));
            if (!items.length && !up.length) return [];
            if (!items.length) {
                // Nothing notable: say so, with the range of highs
                const highs = days.map(k => up[k].temp), last = whenName(up[up.length - 1].p, now).replace(/ night$/, '');
                const dry = up.every(x => x.pop < 30);
                return [{ icon: 'calm', text: `${dry ? 'Dry and quiet' : 'Nothing major'} through ${last}${highs.length ? `, highs ${Math.min(...highs)}\u2013${Math.max(...highs)}\u00B0` : ''}` }];
            }
            return items.sort((a, b) => b.score - a.score).slice(0, 3).sort((a, b) => a.t - b.t || b.score - a.score);
        }

        // ---------- Week: per-day summary + day icons ----------

        // Day icons on a 32 grid. The cloud is filled white so it masks the sun behind it.
        const CLOUD = `<path d="M9 25 H24 A5 5 0 0 0 24.5 15 A8 8 0 0 0 9.2 13.8 A5.6 5.6 0 0 0 9 25 Z" fill="#fff"/>`;
        const UP = (s) => `<g transform="translate(0 -4)">${s}</g>`;
        const WX = {
            sunny: `<circle cx="16" cy="16" r="7"/><path d="M16 1.5 V5.5 M16 26.5 V30.5 M1.5 16 H5.5 M26.5 16 H30.5 M5.7 5.7 l2.8 2.8 M23.5 23.5 l2.8 2.8 M26.3 5.7 L23.5 8.5 M8.5 23.5 l-2.8 2.8"/>`,
            moon: `<path d="M19 4 a12 12 0 1 0 9 17 a10 10 0 0 1 -9 -17 Z"/>`,
            partly: `<circle cx="12" cy="11" r="5"/><path d="M12 2 V3.5 M3 11 H4.5 M5.6 4.6 l1.1 1.1 M18.4 4.6 l-1.1 1.1"/><g transform="translate(2 3)">${CLOUD}</g>`,
            cloud: CLOUD,
            rain: UP(CLOUD) + `<path d="M11 25 l-2 5 M17 25 l-2 5 M23 25 l-2 5"/>`,
            storm: UP(CLOUD) + `<path d="M17 19 L12.5 26 H16.5 L14 31.5 L21 24 H17 L19.5 19 Z" fill="#000" stroke-width="1.5"/>`,
            snow: UP(CLOUD) + `<path d="M10 25.5 v4 M8 27.5 h4 M16 27 v4 M14 29 h4 M22 25.5 v4 M20 27.5 h4" stroke-width="2"/>`,
            fog: UP(CLOUD) + `<path d="M6 26 H24 M10 30 H28"/>`
        };

        function wxKind(p) {
            const w = analyze(p);
            if (w.snow) return 'snow';
            if (w.rain) return w.thunder ? 'storm' : 'rain';
            if (w.fog) return 'fog';
            if (w.sky === 'clear' || w.sky === 'mostly') return w.night ? 'moon' : 'sunny';
            return w.sky === 'partly' ? (w.night ? 'cloud' : 'partly') : 'cloud';
        }

        // One entry per local day: { off, start, name, hi, lo, pop, icon }.
        // A night period counts toward the day it starts (NWS "Overnight" from midnight goes to the day before).
        function week(periods, now) {
            const byOff = new Map();
            for (const p of periods) {
                if (new Date(p.endTime) <= now) continue;
                const start = new Date(p.startTime), night = p.isDaytime === false;
                const off = Math.max(0, dayOffset(new Date(+start - (night ? 6 * 36e5 : 0)), now));
                if (!byOff.has(off)) byOff.set(off, { off, start, hi: NaN, lo: NaN, pop: 0 });
                const d = byOff.get(off), x = periodInfo(p);
                if (night) d.lo = x.temp; else { d.hi = x.temp; d.dayP = p; }
                d.nightP = night ? p : d.nightP;
                d.pop = Math.max(d.pop, x.pop);
            }
            return [...byOff.values()].sort((a, b) => a.off - b.off).map(d => {
                const p = d.dayP || d.nightP;
                const dow = d.start.toLocaleDateString('en-US', { weekday: 'short', timeZone: TZ });
                return { ...d, name: dow, icon: wxKind(p) };
            });
        }

        // Current temperature in F from the observation (NaN if missing)
        function nowTempF(current) {
            const t = current?.temperature, v = asNumber(t?.value ?? t);
            return /degC/i.test(t?.unitCode || '') ? v * 9 / 5 + 32 : v;
        }

        // ---------- Right panel: render ----------

        // Highs (thick line, solid dots, labels above) and lows (thin dashed line, open dots, labels below)
        // for up to 6 days on one scale, with day names, icons, and rain chances in columns.
        function trendChart(days, width) {
            // Inset the columns so labels in the outer ones (e.g. "58°" in a wider device font) don't clip
            const inset = 8, n = days.length, col = (width - 2 * inset) / n, cx = (i) => inset + col * i + col / 2;
            const top = 126, bot = 226;   // y range for the data points
            const temps = days.flatMap(d => [d.hi, d.lo]).filter(isFinite);
            const min = Math.min(...temps), max = Math.max(...temps), span = Math.max(1, max - min);
            const y = (t) => bot - (bot - top) * (t - min) / span;
            const line = (key) => days.map((d, i) => isFinite(d[key]) ? `${f(cx(i))},${f(y(d[key]))}` : null)
                .filter(Boolean).map((p, i) => (i ? 'L' : 'M') + p).join(' ');

            let s = '';
            days.forEach((d, i) => {
                const x = cx(i);
                if (d.off === 0) s += `<rect x="${f(x - 30)}" y="6" width="60" height="22" rx="11" fill="#000" stroke="none"/>`;
                s += `<text class="dn${d.off === 0 ? ' on' : ''}" x="${f(x)}" y="22">${d.name.toUpperCase()}</text>`;
                s += `<svg x="${f(x - 20)}" y="30" width="40" height="40" viewBox="0 0 32 32">${WX[d.icon] || WX.cloud}</svg>`;
                if (d.pop >= 20) s += `<text class="pp" x="${f(x)}" y="90">${d.pop}%</text>`;
            });
            s += `<path d="${line('hi')}" stroke-width="4"/>`;
            s += `<path d="${line('lo')}" stroke-width="2" stroke-dasharray="5 5"/>`;
            days.forEach((d, i) => {
                const x = cx(i);
                if (isFinite(d.hi)) s += `<circle cx="${f(x)}" cy="${f(y(d.hi))}" r="5" fill="#000"/><text class="th" x="${f(x)}" y="${f(y(d.hi) - 11)}">${deg(d.hi)}</text>`;
                if (isFinite(d.lo)) s += `<circle cx="${f(x)}" cy="${f(y(d.lo))}" r="4.5" fill="#fff" stroke-width="2.5"/><text class="tl" x="${f(x)}" y="${f(y(d.lo) + 24)}">${deg(d.lo)}</text>`;
            });
            return `<svg viewBox="0 0 ${width} 256" width="${width}" height="256" role="img" aria-label="Highs and lows for the next ${n} days">${s}</svg>`;
        }

        function renderPanel(period, w, periods, now, current, location, alerts) {
            const info = periodInfo(period);
            const days = week(periods, now).slice(0, 6);

            // Now: observed temperature, falling back to the current forecast period
            const nowT = isFinite(nowTempF(current)) ? nowTempF(current) : w.temp;

            // Rain chance + expected total for the current period
            const total = info.amount ? `${info.amount.text}${info.amount.kind === 'Rain' ? '' : ' ' + info.amount.kind.toLowerCase()}` : info.pop < 20 ? 'Dry' : '';
            const rain = `${info.pop}%${total ? ` &middot; ${total}` : ''}`;

            // By day the next sunset; at night the next sunrise
            const lat = asNumber(location?.latitude ?? location?.lat), lon = asNumber(location?.longitude ?? location?.lon ?? location?.lng);
            let sun = sunTimes(lat, lon, now), sunRow = '';
            if (sun) {
                const day = now >= sun.rise && now < sun.set;
                if (!day && now >= sun.set) sun = sunTimes(lat, lon, new Date(+now + 864e5)) || sun;
                sunRow = `<div class="mini">${ICONS.sun(!day)}<span>${clock(day ? sun.set : sun.rise)}</span></div>`;
            }

            let hl = [];
            try { hl = highlights(periods, now, alerts).slice(0, 2); } catch (e) { hl = []; }

            const ts = current?.timestamp ? new Date(current.timestamp) : now;
            document.getElementById('panel').innerHTML = `
                <div class="phead">
                    <span class="date">${now.toLocaleDateString('en-US', { timeZone: TZ, weekday: 'short', month: 'short', day: 'numeric' })}</span>
                    <span class="updated">Updated ${ts.toLocaleTimeString('en-US', { timeZone: TZ, hour: 'numeric', minute: '2-digit' })}</span>
                </div>
                <div class="stat">
                    <span class="ico">${ICONS.thermo}</span>
                    <div class="v"><span class="big">${deg(nowT)}</span></div>
                    <div class="minis">
                        <div class="mini">${ICONS.drop(info.pop)}<span>${rain}</span></div>
                        ${sunRow}
                    </div>
                </div>
                ${days.length ? `<div class="chart">${trendChart(days, 360)}</div>` : ''}
                <section class="heads">
                    <ul>${hl.map(h => `<li>${hlIcon(h.icon)}<span>${h.text}</span></li>`).join('')}</ul>
                </section>`;
        }

        function run() {
            try {
                // Data is loaded via liquid templates by the TRMNL server. See example-weather.json.
                const current = JSON.parse(`{{current|json}}`);
                const forecast = JSON.parse(`{{forecast|json}}`);
                const location = JSON.parse(`{{location|json}}`);
                // Newer API field; may be missing (renders empty/null). String.raw keeps the JSON's
                // \n and \" escapes intact (alert instructions contain both).
                let alerts = null;
                try { alerts = JSON.parse(String.raw`{{alerts|json}}` || 'null'); } catch (e) { alerts = null; }
                // Optional local-preview overrides: window.FUN_PREVIEW = { now: ISO, egg: 'owl' }
                const pv = window.FUN_PREVIEW || {};
                const now = pv.now ? new Date(pv.now) : new Date();
                const period = pickPeriod(forecast, now);
                const w = analyze(period);
                const egg = 'egg' in pv ? pv.egg : pickEgg(w, now);
                document.getElementById('scene').innerHTML = drawScene(w, egg, now);
                renderPanel(period, w, getPeriods(forecast), now, current, location, alerts);
            } catch (err) {
                document.getElementById('scene').innerHTML = `<div style="padding:16px; font:700 24px system-ui">Render error</div><div style="padding:0 16px; font:400 18px system-ui">${String(err)}</div>`;
            }
        }

        run();
    })();
</script>
